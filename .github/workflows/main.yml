name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-package:
    runs-on: macos-15
    strategy:
      matrix:
        xcode:
        - '16.4' # Swift 6.0.3 (highest)
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
        with:
          xcode: ${{ matrix.xcode }}
      - name: Build Package
        run: bundle exec rake build:package

  build-epoxy-core:
    runs-on: macos-15
    strategy:
      matrix:
        xcode:
        - '16.4' # Swift 6.0.3 (highest)
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
        with:
          xcode: ${{ matrix.xcode }}
      - name: Build EpoxyCore
        run: bundle exec rake build:EpoxyCore

  build-example:
    runs-on: macos-15
    strategy:
      matrix:
        xcode:
        - '16.4' # Swift 6.0.3 (highest)
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
        with:
          xcode: ${{ matrix.xcode }}
      - name: Build Example
        run: bundle exec rake build:example

  test-package:
    runs-on: macos-15
    strategy:
      matrix:
        xcode:
        - '16.4' # Swift 6.0.3 (highest)
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
        with:
          xcode: ${{ matrix.xcode }}
      - name: Test Package
        run: bundle exec rake test:package

  test-compiler:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator modules
        run: >-
          xcodebuild build -scheme Epoxy
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/epoxy-compiler"
          CODE_SIGNING_ALLOWED=NO
      - name: Test behavior compiler contracts (Swift 5 and Swift 6 modes)
        run: bash Tests/CompilerTests/check-set-behaviors.sh "$RUNNER_TEMP/epoxy-compiler/Build/Products/Debug-iphonesimulator"
      - name: Build layout simulator modules with isolation inference
        run: >-
          xcodebuild build -scheme EpoxyLayoutGroups
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/epoxy-layout-compiler"
          SWIFT_STRICT_CONCURRENCY=complete
          OTHER_SWIFT_FLAGS='$(inherited) -enable-upcoming-feature InferIsolatedConformances'
          CODE_SIGNING_ALLOWED=NO
      - name: Test layout compiler contracts (Swift 5 and Swift 6 modes)
        run: bash Tests/CompilerTests/check-constrainable.sh "$RUNNER_TEMP/epoxy-layout-compiler/Build/Products/Debug-iphonesimulator"
      - name: Test wrapper compiler contracts (Swift 5 and Swift 6 modes)
        run: bash Tests/CompilerTests/check-item-wrapper.sh

  lint-swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
      - name: Lint Swift
        run: bundle exec rake lint:swift

  lint-podspec:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
      - name: Lint Podspec
        run: bundle exec rake lint:podspec
